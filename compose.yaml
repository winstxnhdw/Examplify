services:
  tabbyapi:
    build: .
    init: true
    gpus: all
    cpuset: "${TABBY_CPUSET:-}"
    ports: [127.0.0.1:5000:5000]
    environment:
      EXL3_INT8_GEMV: "1"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./reliable.yml:/app/sampler_overrides/reliable.yml:ro
      - ./.cache/exllamav3:/root/.cache/exllamav3
      - ./.cache/triton:/root/.triton

  embedding:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.embedding
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:7997/health]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m

  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.5.7@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
    init: true
    depends_on:
      tabbyapi:
        condition: service_started
      embedding:
        condition: service_healthy
    ports: [127.0.0.1:9621:9621]
    environment:
      HOST: 0.0.0.0
      PORT: "9621"
      WORKERS: "1"
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      LIGHTRAG_DEFAULT_UI: workspace

      LLM_BINDING: openai
      LLM_BINDING_HOST: http://tabbyapi:5000/v1
      LLM_BINDING_API_KEY: local-tabbyapi
      LLM_MODEL: Qwen3.8-27B-exl3-SC_4.00bpw_H5
      LLM_TIMEOUT: "300"
      MAX_ASYNC_LLM: "8"
      EXTRACT_MAX_ASYNC_LLM: "8"
      MAX_PARALLEL_INSERT: "3"
      KEYWORD_MAX_ASYNC_LLM: "1"
      QUERY_MAX_ASYNC_LLM: "1"
      KEYWORD_OPENAI_LLM_TEMPERATURE: "1.0"
      KEYWORD_OPENAI_LLM_MAX_TOKENS: "4096"
      KEYWORD_OPENAI_LLM_EXTRA_BODY: '{"chat_template_kwargs":{"enable_thinking":false}}'
      QUERY_OPENAI_LLM_TEMPERATURE: "1.0"
      QUERY_OPENAI_LLM_MAX_TOKENS: "4096"

      EXTRACT_LLM_MODEL: gpt-6-luna
      EXTRACT_LLM_BINDING_HOST: https://api.openai.com/v1
      EXTRACT_LLM_BINDING_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      EXTRACT_OPENAI_LLM_REASONING_EFFORT: medium
      EXTRACT_OPENAI_LLM_MAX_COMPLETION_TOKENS: "8192"

      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: http://embedding:7997/v1
      EMBEDDING_BINDING_API_KEY: local-embedding
      EMBEDDING_MODEL: Octen/Octen-Embedding-0.6B
      EMBEDDING_DIM: "1024"
      EMBEDDING_TOKEN_LIMIT: "4096"
      EMBEDDING_ASYMMETRIC: "true"
      EMBEDDING_QUERY_PREFIX: |-
        Instruct: Given a web search query, retrieve relevant passages that answer the query
        Query:
      EMBEDDING_DOCUMENT_PREFIX: NO_PREFIX
      EMBEDDING_SEND_DIM: "false"
      EMBEDDING_USE_BASE64: "false"
      EMBEDDING_TIMEOUT: "300"
      EMBEDDING_FUNC_MAX_ASYNC: "1"
      EMBEDDING_BATCH_NUM: "4"

      MAX_TOTAL_TOKENS: "10000"
      MAX_ENTITY_TOKENS: "3000"
      MAX_RELATION_TOKENS: "3000"
      MAX_EXTRACT_INPUT_TOKENS: "8000"
      SUMMARY_CONTEXT_SIZE: "8000"
      CHUNK_SIZE: "1200"
      CHUNK_OVERLAP_SIZE: "100"
      LIGHTRAG_PARSER: "*:native-teP,*:legacy-R"
      SUMMARY_LANGUAGE: English
      ENABLE_LLM_CACHE: "true"
      ENABLE_LLM_CACHE_FOR_EXTRACT: "true"
      RERANK_BINDING: "null"
      RERANK_BY_DEFAULT: "false"
      VLM_PROCESS_ENABLE: "false"

      LIGHTRAG_KV_STORAGE: JsonKVStorage
      LIGHTRAG_DOC_STATUS_STORAGE: JsonDocStatusStorage
      LIGHTRAG_GRAPH_STORAGE: NetworkXStorage
      LIGHTRAG_VECTOR_STORAGE: NanoVectorDBStorage
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs

  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
    init: true
    depends_on: [lightrag]
    command: [--config, /app/config.yaml]
    ports: [127.0.0.1:4000:4000]
    volumes:
      - ./litellm.yml:/app/config.yaml:ro
